name: Update profile graphics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"
  push:
    paths:
      - "assets/profile.json"
      - "scripts/generate.py"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate SVG assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/generate.py

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --cached --quiet || git commit -m "chore: refresh profile graphics"
          git push
